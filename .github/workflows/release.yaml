name: "C++ CI"

on:
  push:
    branches:
      - project_work

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions: write-all
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install libboost-test-dev libboost-program-options1.71-dev libfmt-dev -y
      - run: cmake .
      - run: cmake --build .
      - run: ./build/application -p proto/test.yaml -l cpp -s ./generated
      - run: cmake -S tests -B tests/build
      - run: cmake --build tests/build
      - run: ./tests/build/test_generator
      - run: cmake --build . --target package
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./application-0.0.${{ github.run_number }}-Linux.deb
          asset_name: application-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package